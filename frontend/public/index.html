<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Client</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <span class="brand-name">RAG Client</span>
    </div>
    <div class="header-apikey">
      <label class="apikey-label" for="apiKeyInput">API Key</label>
      <div class="apikey-field">
        <input
          id="apiKeyInput"
          type="password"
          class="apikey-input"
          placeholder="Введите Bearer токен..."
          autocomplete="off"
        />
        <button class="btn-icon" id="toggleApiKey" title="Показать/скрыть ключ">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="btn-primary btn-sm" id="saveApiKey">Сохранить</button>
      </div>
      <span class="apikey-status" id="apiKeyStatus"></span>
    </div>

    <button class="btn-icon btn-theme" id="themeToggle" title="Тёмная / светлая тема">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- ===== TABS ===== -->
  <nav class="tabs-nav">
    <button class="tab-btn active" data-tab="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Чат (RAG Search)
    </button>
    <button class="tab-btn" data-tab="collections">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Коллекции
    </button>
    <button class="tab-btn" data-tab="rawsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Raw Search
    </button>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="app-main">

    <!-- ===== TAB: CHAT ===== -->
    <div class="tab-panel active" id="tab-chat">
      <div class="chat-layout">

        <!-- Settings Sidebar -->
        <aside class="chat-sidebar">
          <div class="sidebar-title">Параметры запроса</div>

          <div class="form-group">
            <label>Коллекция</label>
            <div class="collection-select-row">
              <select id="chatCollection" class="form-input">
                <option value="">— выберите —</option>
              </select>
              <button class="btn-icon btn-reload" id="loadCollectionsForChat" title="Загрузить список коллекций">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23 4 23 10 17 10"/>
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
              </button>
            </div>
            <input id="chatCollectionCustom" type="text" class="form-input mt-4" placeholder="Или введите ключ вручную..." />
          </div>

          <div class="form-group">
            <label>Agent Role</label>
            <input id="chatAgentRole" type="text" class="form-input" placeholder="assistant" value="assistant" />
          </div>

          <div class="form-group">
            <label>Max Documents <span class="hint">(0 = по умолч.)</span></label>
            <input id="chatMaxDocs" type="number" class="form-input" min="0" max="200" value="10" />
          </div>

          <div class="form-group">
            <label>Min Similarity <span class="hint">0..1</span></label>
            <div class="slider-row">
              <input id="chatMinSim" type="range" class="slider" min="0" max="1" step="0.05" value="0.5" />
              <span class="slider-val" id="chatMinSimVal">0.50</span>
            </div>
          </div>

          <div class="form-group">
            <label>Max Tokens <span class="hint">(0 = по умолч.)</span></label>
            <input id="chatMaxTokens" type="number" class="form-input" min="0" max="16000" value="1024" />
          </div>

          <div class="form-group">
            <label>Temperature <span class="hint">0..0.99</span></label>
            <div class="slider-row">
              <input id="chatTemp" type="range" class="slider" min="0" max="0.99" step="0.01" value="0.2" />
              <span class="slider-val" id="chatTempVal">0.20</span>
            </div>
          </div>

          <div class="form-group">
            <label>Контекст <span class="hint">(кол-во пред. сообщений)</span></label>
            <input id="chatCtxSize" type="number" class="form-input" min="0" max="20" value="6" />
          </div>

          <button class="btn-outline btn-full mt-12" id="clearChat">Очистить чат</button>
        </aside>

        <!-- Chat Area -->
        <section class="chat-area">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-welcome">
              <div class="welcome-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                  <path d="M2 17l10 5 10-5"/>
                  <path d="M2 12l10 5 10-5"/>
                </svg>
              </div>
              <p>Задайте вопрос по выбранной коллекции</p>
              <p class="welcome-hint">Укажите ключ коллекции в панели слева и введите вопрос ниже</p>
            </div>
          </div>
          <div class="chat-input-bar">
            <textarea
              id="chatInput"
              class="chat-textarea"
              placeholder="Введите вопрос... (Enter — отправить, Shift+Enter — новая строка)"
              rows="1"
            ></textarea>
            <button class="btn-send" id="sendChat" title="Отправить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </section>
      </div>
    </div>

    <!-- ===== TAB: COLLECTIONS ===== -->
    <div class="tab-panel" id="tab-collections">
      <div class="collections-layout">

        <!-- Filter Panel -->
        <div class="filter-panel">
          <div class="filter-row">
            <div class="form-group">
              <label>Название (LIKE)</label>
              <input id="colFilterName" type="text" class="form-input" placeholder="product%" />
            </div>
            <div class="form-group">
              <label>Ключ (LIKE)</label>
              <input id="colFilterKey" type="text" class="form-input" placeholder="product_%" />
            </div>
            <div class="form-group">
              <label>Сортировка</label>
              <select id="colOrderBy" class="form-input">
                <option value="">По умолчанию</option>
                <option value="id">ID</option>
                <option value="name">Название</option>
                <option value="key">Ключ</option>
                <option value="created_at">Дата создания</option>
                <option value="updated_at">Дата обновления</option>
              </select>
            </div>
            <div class="form-group">
              <label>Направление</label>
              <select id="colOrderDir" class="form-input">
                <option value="asc">ASC</option>
                <option value="desc">DESC</option>
              </select>
            </div>
            <div class="form-group form-group-sm">
              <label>Страница</label>
              <input id="colPage" type="number" class="form-input" min="1" value="1" />
            </div>
            <div class="form-group form-group-sm">
              <label>Лимит</label>
              <input id="colLimit" type="number" class="form-input" min="1" max="200" value="50" />
            </div>
            <div class="form-group form-group-action">
              <label>&nbsp;</label>
              <button class="btn-primary" id="loadCollections">Загрузить</button>
            </div>
          </div>
        </div>

        <!-- Table Area -->
        <div class="table-container" id="collectionsContainer">
          <div class="empty-state">Нажмите «Загрузить» для получения списка коллекций</div>
        </div>
      </div>
    </div>

    <!-- ===== TAB: RAW SEARCH ===== -->
    <div class="tab-panel" id="tab-rawsearch">
      <div class="rawsearch-layout">

        <div class="rawsearch-form">
          <div class="form-row">
            <div class="form-group form-group-wide">
              <label>Ключ коллекции <span class="required">*</span></label>
              <input id="rawCollection" type="text" class="form-input" placeholder="product_docs" />
            </div>
            <div class="form-group form-group-sm">
              <label>Max Documents</label>
              <input id="rawMaxDocs" type="number" class="form-input" min="1" max="200" value="20" />
            </div>
            <div class="form-group form-group-sm">
              <label>Min Similarity</label>
              <input id="rawMinSim" type="number" class="form-input" min="0" max="1" step="0.05" value="0.5" />
            </div>
          </div>
          <div class="form-group">
            <label>Поисковый запрос <span class="required">*</span></label>
            <textarea id="rawMessage" class="form-input form-textarea" rows="3" placeholder="Введите запрос для векторного поиска..."></textarea>
          </div>
          <button class="btn-primary" id="runRawSearch">Найти чанки</button>
        </div>

        <div id="rawResults" class="raw-results"></div>
      </div>
    </div>

  </main>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
